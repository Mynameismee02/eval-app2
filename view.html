<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผลการประเมินร้านอาหาร</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#fdf6f9;--ink:#4a4458;--muted:#8a8499;--pink:#f9d6e3;--mint:#d6f1e6;--lav:#e4dcf7;--sky:#d9ecfa;--yel:#fbefc7;--accent:#b79ced;--accent-d:#9378d6;--line:#ece6f3;--err:#e07a8f}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,#fdf0f5,#eef4fd 60%,#eefaf4);min-height:100vh;font-family:'Noto Sans Thai',system-ui,sans-serif;color:var(--ink);line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding:20px 14px 60px}
header{background:linear-gradient(120deg,var(--sky),var(--lav));border-radius:22px;padding:22px;text-align:center;box-shadow:0 6px 20px rgba(183,156,237,.18)}
header h1{margin:0;font-size:1.45rem}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 14px rgba(120,100,160,.08)}
input,select{padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;color:inherit;background:#fffdfd;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--lav)}
button{font:inherit;border:0;border-radius:99px;padding:10px 22px;cursor:pointer;font-weight:500;background:var(--accent);color:#fff}
button.ghost{background:var(--lav);color:var(--ink)}
#gate{text-align:center;padding:30px 18px}#gate input{width:200px;text-align:center;margin:10px 6px}
.msg{color:var(--err);min-height:1.5em}
#app{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:1.6rem}.stat span{font-size:.8rem;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{font-size:.85rem;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.item{border-bottom:1px solid var(--line);padding:14px 0}.item:last-child{border:0}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:500}
.badge{padding:2px 12px;border-radius:99px;font-size:.85rem}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chip{width:30px;height:30px;border-radius:9px;text-align:center;line-height:30px;font-size:.85rem;font-weight:500}
.s1,.s2{background:var(--pink)}.s3{background:var(--yel)}.s4,.s5{background:var(--mint)}
.tag{display:inline-block;background:var(--pink);border-radius:99px;padding:2px 12px;font-size:.8rem;margin:2px 4px 2px 0}.tag.ok{background:var(--mint)}
.note{color:var(--muted);font-size:.9rem}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.photos img{width:84px;height:84px;object-fit:cover;border-radius:12px;cursor:pointer;background:var(--line)}
#lb{display:none;position:fixed;inset:0;background:rgba(50,40,70,.85);z-index:9;align-items:center;justify-content:center;padding:14px}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:600px){.bars .row{grid-template-columns:110px 1fr 36px}.stats{gap:6px}.stat b{font-size:1.2rem}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>ผลการประเมินร้านอาหาร</h1></header>

<div class="card" id="gate">
  <div>กรุณาใส่รหัส PIN เพื่อดูข้อมูล</div>
  <input type="password" id="pin" inputmode="numeric" autocomplete="off"><button id="go">เข้าดู</button>
  <div class="msg" id="msg"></div>
</div>

<div id="app">
  <div class="stats">
    <div class="stat" style="background:var(--sky)"><b id="sN">0</b><span>รายการ</span></div>
    <div class="stat" style="background:var(--mint)"><b id="sAvg">-</b><span>คะแนนเฉลี่ย (เต็ม 5)</span></div>
    <div class="stat" style="background:var(--pink)"><b id="sPb">0</b><span>รายการที่พบปัญหา</span></div>
  </div>
  <div class="card filters">
    <div><label>ร้าน</label><br><select id="fShop"><option value="">ทั้งหมด</option></select></div>
    <div><label>ผู้ประเมิน</label><br><select id="fRev"><option value="">ทั้งหมด</option></select></div>
    <div><label>ตั้งแต่</label><br><input type="date" id="fFrom"></div>
    <div><label>ถึง</label><br><input type="date" id="fTo"></div>
    <div><label><input type="checkbox" id="fPb"> เฉพาะที่พบปัญหา</label></div>
    <div style="margin-left:auto;display:flex;gap:8px"><button class="ghost" id="rf">รีเฟรช</button><button id="csv">ดาวน์โหลด CSV</button></div>
  </div>
  <div class="card bars"><b>คะแนนเฉลี่ยรายข้อ</b><div id="bars"></div></div>
  <div class="card"><div id="list"></div></div>
</div>
</div>
<div id="lb"><img id="lbi" alt=""></div>

<script>
const $=s=>document.querySelector(s);
const CRIT=["อาหารแห้ง","เครื่องปรุง / อย.","อาหารปรุงสำเร็จ / เครื่องดื่ม","น้ำแข็ง","ภาชนะบรรจุอาหาร","สุขอนามัยผู้สัมผัสอาหาร","อบรมสุขาภิบาล","ป้องกันสัตว์ / แมลง"];
let ALL=[],VIEW=[];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function iso(d){const m=String(d).match(/^(\d+)\/(\d+)\/(\d+)$/);return m?`${+m[3]-543}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}
const pid=u=>(String(u).match(/\/d\/([^/?]+)/)||String(u).match(/[?&]id=([^&]+)/)||[])[1];
const thumb=(u,w)=>`https://drive.google.com/thumbnail?id=${pid(u)}&sz=w${w}`;

async function load(pin){
  $('#msg').textContent='กำลังโหลด...';
  try{
    const j=await (await fetch(window.SCRIPT_URL+'?pin='+encodeURIComponent(pin))).json();
    if(!j.ok){$('#msg').textContent=j.error==='pin'?'รหัสไม่ถูกต้อง':'เกิดข้อผิดพลาด';sessionStorage.removeItem('pin');return}
    sessionStorage.setItem('pin',pin);
    ALL=j.rows.map(r=>({...r,iso:iso(r.date),avg:r.scores.length?r.total/r.scores.length:0,
      pb:!!r.problems&&r.problems.trim()!=='ไม่พบปัญหา'})).sort((a,b)=>String(b.time).localeCompare(String(a.time)));
    $('#gate').style.display='none';$('#app').style.display='block';
    fill('#fShop',[...new Set(ALL.map(r=>r.shop))].sort((a,b)=>a-b));
    fill('#fRev',[...new Set(ALL.map(r=>r.reviewer))].sort());
    render();
  }catch(e){$('#msg').textContent='โหลดไม่สำเร็จ ตรวจสอบ URL ใน config.js'}
}
function fill(sel,vals){const el=$(sel),cur=el.value;el.length=1;vals.forEach(v=>el.add(new Option(v,v)));el.value=cur}

function render(){
  const s=$('#fShop').value,rv=$('#fRev').value,f=$('#fFrom').value,t=$('#fTo').value,pb=$('#fPb').checked;
  VIEW=ALL.filter(r=>(!s||String(r.shop)===s)&&(!rv||r.reviewer===rv)&&(!f||r.iso>=f)&&(!t||r.iso<=t)&&(!pb||r.pb));
  $('#sN').textContent=VIEW.length;
  $('#sAvg').textContent=VIEW.length?(VIEW.reduce((a,r)=>a+r.avg,0)/VIEW.length).toFixed(2):'-';
  $('#sPb').textContent=VIEW.filter(r=>r.pb).length;
  $('#bars').innerHTML=CRIT.map((c,i)=>{const v=VIEW.length?VIEW.reduce((a,r)=>a+(+r.scores[i]||0),0)/VIEW.length:0;
    return `<div class="row"><span>${i+1}. ${c}</span><div class="bar"><i style="width:${v*20}%"></i></div><b>${v?v.toFixed(1):'-'}</b></div>`}).join('');
  $('#list').innerHTML=VIEW.length?VIEW.map(r=>{
    const bg=r.avg>=4?'var(--mint)':r.avg>=3?'var(--yel)':'var(--pink)';
    const tags=(r.problems||'ไม่ระบุ').split(', ').map(p=>`<span class="tag ${p==='ไม่พบปัญหา'?'ok':''}">${esc(p)}</span>`).join('');
    return `<div class="item"><div class="top"><span>ร้านที่ ${esc(r.shop)} · ${esc(r.date)} · ${esc(r.reviewer)}</span><span class="badge" style="background:${bg}">เฉลี่ย ${r.avg.toFixed(2)}</span></div>
    <div class="chips">${r.scores.map(n=>`<span class="chip s${n}">${n}</span>`).join('')}</div>
    <div>${tags}</div>${r.note?`<div class="note">💬 ${esc(r.note)}</div>`:''}
    ${r.photos.length?`<div class="photos">${r.photos.map(u=>`<img loading="lazy" src="${thumb(u,300)}" data-full="${thumb(u,1200)}" alt="หลักฐาน">`).join('')}</div>`:''}</div>`}).join('')
    :'<div class="note">ไม่พบข้อมูล</div>';
}
['#fShop','#fRev','#fFrom','#fTo','#fPb'].forEach(s=>$(s).onchange=render);
$('#rf').onclick=()=>load(sessionStorage.getItem('pin'));
$('#go').onclick=()=>load($('#pin').value.trim());
$('#pin').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
$('#list').onclick=e=>{if(e.target.dataset.full){$('#lbi').src=e.target.dataset.full;$('#lb').style.display='flex'}};
$('#lb').onclick=()=>{$('#lb').style.display='none'};
$('#csv').onclick=()=>{
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[["วันที่","ร้าน","ผู้ประเมิน",...CRIT,"คะแนนรวม","ปัญหาที่พบ","ข้อเสนอแนะ","รูปภาพ"],
    ...VIEW.map(r=>[r.date,r.shop,r.reviewer,...r.scores,r.total,r.problems,r.note,r.photos.join(' ')])];
  const b=new Blob(["\ufeff"+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ผลประเมินร้านอาหาร.csv';a.click()};
if(sessionStorage.getItem('pin'))load(sessionStorage.getItem('pin'));
</script>
</body>
</html>
